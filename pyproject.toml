[project]
name = "freebuff-router"
version = "1.0.0"
description = "OpenAI-compatible API gateway for Freebuff — Python port (FastAPI + sqlite3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx[socks]>=0.28",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[project.scripts]
freebuff-router = "freebuffrouter.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["freebuffrouter*"]

[tool.setuptools.package-data]
freebuffrouter = ["dashboard.html"]
